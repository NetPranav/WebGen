# ROADMAP Phase 1.4 — every push and PR must typecheck, lint, test and build.
# ROADMAP Phase 6 — plus the edition=initial bundle-scope gate and a doc-link check.
# ROADMAP Phase 8.4 — plus the editor ad-hoc-compatibility grep gate.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 errors, warning budget enforced)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Bundle scope (edition=initial excludes After-track panels)
        run: npm run check:bundle-scope

      - name: Doc links (DOCS/Initial)
        run: npm run check:doc-links

      - name: No ad-hoc compatibility logic in the editor (Phase 8.4)
        run: npm run check:no-adhoc-compat

  # ROADMAP Phase 4.1 — the Phase 3 and Phase 4 browser gates, in CI, on
  # every push/PR, on Chromium, Firefox and WebKit (playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser E2E (builds and starts the app itself)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
